name: NEXSUS CPU full architecture benchmark

on:
  workflow_dispatch:

concurrency:
  group: nexus-cpu-full-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile benchmark generator
        run: |
          python -m py_compile "NEXUS CPU/tools/cpu_comparison_sim.py"
          python -m py_compile "NEXUS CPU/tools/generate_full_architecture_benchmark.py"
      - name: Generate full architecture benchmark tables
        run: |
          python "NEXUS CPU/tools/generate_full_architecture_benchmark.py" --scale 1 --output-dir /tmp/nexus-full-architecture-benchmark
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("/tmp/nexus-full-architecture-benchmark")
          data = json.loads((root / "full-architecture-results.json").read_text(encoding="utf-8"))
          assert len(data["kernel_names"]) == 37
          assert set(data["modes"]) == {"native", "normalized_8core", "normalized_8core_common_memory"}
          expected = {"amd_9950x3d2", "intel_xeon_698x", "apple_m6", "nexus_balanced_128"}
          for mode_name, mode in data["modes"].items():
              assert set(mode) == expected
              assert len({mode[arch]["total_ops"] for arch in expected}) == 1
              for kernel in data["kernel_names"]:
                  assert len({mode[arch]["kernels"][kernel]["ops"] for arch in expected}) == 1
              if mode_name != "native":
                  assert {mode[arch]["cores_configured"] for arch in expected} == {8}
          common = data["modes"]["normalized_8core_common_memory"]
          assert {common[arch]["clock_ghz"] for arch in expected} == {3.0}
          assert {common[arch]["aggregate_dram_bytes_per_cycle"] for arch in expected} == {512}
          assert len({common[arch]["cpu_ram_reference_clock_ghz"] for arch in expected}) == 1
          nexus = common["nexus_balanced_128"]["kernels"]["streaming"]["memory_controller"]
          assert nexus["per_core_bytes_per_cycle"] == 64
          assert nexus["aggregate_core_facing_capacity_bytes_per_cycle"] == 512
          assert (root / "full-architecture-results.md").stat().st_size > 1000
          assert (root / "full-architecture-results.csv").stat().st_size > 1000
          print("PASS: 37 kernels, four profiles, three comparison modes.")
          PY
      - name: Upload full architecture benchmark
        uses: actions/upload-artifact@v4
        with:
          name: nexus-cpu-full-architecture-benchmark
          path: /tmp/nexus-full-architecture-benchmark/
          if-no-files-found: error
