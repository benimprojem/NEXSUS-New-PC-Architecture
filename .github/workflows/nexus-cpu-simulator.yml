      - name: Run direct L4-to-L1 transfer design-space sweep
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --l4-l1-sweep --json > /tmp/nexus-l4-l1-transfer-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-l4-l1-transfer-sweep.json", encoding="utf-8"))
          assert data["cores_per_block"] == 8
          assert data["row_count"] == 216
          assert data["transfer_path"] == "L4 -> selected private L1s; L2/L3 bypassed"
          assert data["distribution_policy"] == "serialized per-destination L4 reads; multicast is not modeled"
          assert data["data_ram_baseline_bytes_per_cycle"] == 64
          assert data["hardware_decisions_frozen_by_sweep"] == []
          assert len(data["results"]) == 216
          for row in data["results"]:
              assert row["unique_bytes"] == row["working_set_kib"] * 1024
              assert row["bytes_copied"] == row["unique_bytes"] * row["target_core_count"]
              assert row["l4_source_bytes_read"] == row["bytes_copied"]
              assert row["l4_source_read_count"] == row["chunk_count_per_core"] * row["target_core_count"]
              assert row["cycles"] > 0
              assert row["effective_bytes_per_cycle"] > 0
          print("DIRECT L4 -> L1 TRANSFER DESIGN-SPACE SWEEP")
          print(f'PASS: {data["row_count"]} configurations; no hardware operating point selected.')
          print("BEST THROUGHPUT BY WORKING SET AND TARGET COUNT (UNICAST SOURCE MODEL)")
          for ws in sorted({row["working_set_kib"] for row in data["results"]}):
              for count in (1, 2, 4, 8):
                  candidates = [row for row in data["results"]
                                if row["working_set_kib"] == ws and row["target_core_count"] == count]
                  best = max(candidates, key=lambda item: item["effective_bytes_per_cycle"])
                  print(f'WS={ws} KiB targets={count}: {best["effective_bytes_per_cycle"]:.2f} B/cycle, '
                        f'{best["cycles"]} cycles, chunk={best["chunk_bytes"]}, '
                        f'L4={best["l4_read_bytes_per_cycle"]}, L1={best["l1_ingress_bytes_per_cycle"]}')
          PY
      - name: Run L4 unicast versus multicast distribution comparison
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --l4-l1-distribution-sweep --json > /tmp/nexus-l4-l1-distribution-comparison.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-l4-l1-distribution-comparison.json", encoding="utf-8"))
          assert data["cores_per_block"] == 8
          assert data["row_count"] == 648
          assert data["unicast_baseline_row_count"] == 216
          assert data["multicast_row_count"] == 648
          assert data["hardware_decisions_frozen_by_sweep"] == []
          assert data["data_ram_baseline_bytes_per_cycle"] == 64
          for row in data["results"]:
              assert row["multicast_l4_source_bytes_read"] == row["unique_bytes"]
              assert row["unicast_l4_source_bytes_read"] == row["unique_bytes"] * row["target_core_count"]
              assert row["fanout_bytes"] == row["bytes_copied"]
              assert row["multicast_cycles"] > 0 and row["unicast_cycles"] > 0
              assert row["multicast_speedup_vs_unicast"] > 0
          print("L4 UNICAST / MULTICAST DISTRIBUTION COMPARISON")
          print(f'PASS: {data["row_count"]} multicast rows paired with {data["unicast_baseline_row_count"]} unicast baselines.')
          for count in (1, 2, 4, 8):
              rows = [row for row in data["results"] if row["target_core_count"] == count]
              best = min(rows, key=lambda row: row["multicast_cycles"] / row["unicast_cycles"])
              worst = max(rows, key=lambda row: row["multicast_cycles"] / row["unicast_cycles"])
              print(f'targets={count}: best cycle ratio={best["multicast_cycles"] / best["unicast_cycles"]:.3f}; '
                    f'worst={worst["multicast_cycles"] / worst["unicast_cycles"]:.3f}; '
                    f'L4 bytes saved={best["l4_source_bytes_saved"]}')
          PY
