name: NEXSUS CPU simulator checks

concurrency:
  group: nexus-cpu-simulator-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "NEXUS CPU/tools/**"
      - "NEXUS CPU/NEXSUS-CPU-COMPARISON-SIMULATOR-001.md"
      - ".github/workflows/nexus-cpu-simulator.yml"
  pull_request:
    paths:
      - "NEXUS CPU/tools/**"
      - "NEXUS CPU/NEXSUS-CPU-COMPARISON-SIMULATOR-001.md"
      - ".github/workflows/nexus-cpu-simulator.yml"
  workflow_dispatch:

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile simulator and tests
        run: |
          python -m py_compile "NEXUS CPU/tools/cpu_comparison_sim.py"
          python -m py_compile "NEXUS CPU/tools/test_cpu_comparison_sim.py"
      - name: Run regression tests
        working-directory: "NEXUS CPU/tools"
        run: python test_cpu_comparison_sim.py
      - name: Run comparison smoke test
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --scale 1 --json > /tmp/nexus-cpu-results.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-cpu-results.json", encoding="utf-8"))
          print("CONTROLLED 8-CORE ARCHITECTURE COMPARISON")
          for key, result in data.items():
              print(f'{key}: cycles={result["total_cycles"]} ops={result["total_ops"]} IPC={result["aggregate_ipc"]}')
              for name, kernel in result["kernels"].items():
                  print(f'  {name}: cycles={kernel["cycles"]} ops={kernel["ops"]} IPC={kernel["aggregate_ipc"]}')
          PY
      - name: Run four-way SPM P0 ablation
        run: python "NEXUS CPU/tools/cpu_comparison_sim.py" --ablation --scale 1
      - name: Run normalized eight-core comparison
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --normalized-8core --scale 1 --json > /tmp/nexus-normalized-8core.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-normalized-8core.json", encoding="utf-8"))
          assert len(data) == 4
          assert {row["cores_configured"] for row in data.values()} == {8}
          assert len({row["total_ops"] for row in data.values()}) == 1
          print("PASS: normalized 8-core run, same operation count across all four architectures.")
          PY
      - name: Run branch predictor sensitivity sweep
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --branch-sweep --scale 1 --json > /tmp/nexus-branch-sweep.json
            /tmp/nexus-normalized-8core.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-branch-sweep.json", encoding="utf-8"))
          for name, row in data["kernels"].items():
              assert row["ops_preserved"], name
              print(f'{name}: off={row["cycles_predictor_off"]} compact={row["cycles_compact_predictor"]} mispredicts={row["mispredicts_predictor_off"]}->{row["mispredicts_compact_predictor"]}')
          PY
      - name: Run P0 capacity sensitivity sweep
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --p0-sweep --scale 1 --json > /tmp/nexus-p0-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-p0-sweep.json", encoding="utf-8"))
          print("P0 CAPACITY SENSITIVITY")
          for row in data["results"].values():
              starve = row["kernels"]["p0_starvation"]["cycles"]
              print(f'{row["capacity_kb"]} KiB: total_cycles={row["total_cycles"]} p0_starvation_cycles={starve} ops={row["total_ops"]}')
          PY
      - name: Run instruction fetch latency sensitivity sweep
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --fetch-sweep --json > /tmp/nexus-fetch-sweep.json
            /tmp/nexus-branch-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-fetch-sweep.json", encoding="utf-8"))
          print("INSTRUCTION FETCH REFILL SENSITIVITY")
          for profile, rows in data["results"].items():
              for row in rows.values():
                  print(f'{profile}: refill={row["refill_latency_cycles"]} cycles={row["cycles"]} ops={row["ops"]}')
          PY
      - name: Upload comparison and P0 sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-cpu-comparison-results
          path: |
            /tmp/nexus-cpu-results.json
            /tmp/nexus-p0-sweep.json
            /tmp/nexus-fetch-sweep.json
          if-no-files-found: ignore
