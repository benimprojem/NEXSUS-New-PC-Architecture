name: NEXSUS CPU simulator checks

concurrency:
  group: nexus-cpu-simulator-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths:
      - "NEXUS CPU/tools/**"
      - "NEXUS CPU/NEXSUS-CPU-COMPARISON-SIMULATOR-001.md"
      - "NEXUS CPU/NEXSUS-CPU-CODEFLOW-NAMING-001.md"
      - "Türkçe/NEXSUS-CPU-CODEFLOW-NAMING-001.md"
      - ".github/workflows/nexus-cpu-simulator.yml"
  pull_request:
    paths:
      - "NEXUS CPU/tools/**"
      - "NEXUS CPU/NEXSUS-CPU-COMPARISON-SIMULATOR-001.md"
      - ".github/workflows/nexus-cpu-simulator.yml"
  workflow_dispatch:

jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile simulator and tests
        run: |
          python -m py_compile "NEXUS CPU/tools/cpu_comparison_sim.py"
          python -m py_compile "NEXUS CPU/tools/test_cpu_comparison_sim.py"
          python -m py_compile "NEXUS CPU/tools/l0i_px_pipeline_sim.py"
          python -m py_compile "NEXUS CPU/tools/test_l0i_px_pipeline_sim.py"
          python -m py_compile "NEXUS CPU/tools/run_cross_arch_codeflow_suite.py"
          python -m py_compile "NEXUS CPU/tools/test_nexus_naming_standard.py"
          python -m py_compile "NEXUS CPU/tools/p0p1_command_buffer_sim.py"
          python -m py_compile "NEXUS CPU/tools/test_p0p1_command_buffer_sim.py"
          python -m py_compile "NEXUS CPU/tools/p0p1_refill_sweep.py"
          python -m py_compile "NEXUS CPU/tools/test_p0p1_refill_sweep.py"
          python -m py_compile "NEXUS CPU/tools/p0p1_branch_redirect_sim.py"
          python -m py_compile "NEXUS CPU/tools/test_p0p1_branch_redirect_sim.py"
          python -m py_compile "NEXUS CPU/tools/p0p1_l0i_px_integrated_sim.py"
          python -m py_compile "NEXUS CPU/tools/test_p0p1_l0i_px_integrated_sim.py"
          python -m py_compile "NEXUS CPU/tools/p0p1_l0i_px_integrated_sweep.py"
          python -m py_compile "NEXUS CPU/tools/test_p0p1_l0i_px_integrated_sweep.py"
          python -m py_compile "NEXUS CPU/tools/p0p1_l0i_px_bottleneck_sweep.py"
          python -m py_compile "NEXUS CPU/tools/test_p0p1_l0i_px_bottleneck_sweep.py"
          python -m py_compile "NEXUS CPU/tools/p0p1_l0i_px_refined_sweep.py"
          python -m py_compile "NEXUS CPU/tools/test_p0p1_l0i_px_refined_sweep.py"
          python -m py_compile "NEXUS CPU/tools/p0p1_l0i_px_middle_sweep.py"
          python -m py_compile "NEXUS CPU/tools/test_p0p1_l0i_px_middle_sweep.py"
          python -m py_compile "NEXUS CPU/tools/p0p1_l0i_px_workload_sweep.py"
          python -m py_compile "NEXUS CPU/tools/test_p0p1_l0i_px_workload_sweep.py"
      - name: Run regression tests
        working-directory: "NEXUS CPU/tools"
        run: |
          python test_cpu_comparison_sim.py
          python test_l0i_px_pipeline_sim.py
          python test_nexus_naming_standard.py
          python test_p0p1_command_buffer_sim.py
          python test_p0p1_refill_sweep.py
          python test_p0p1_branch_redirect_sim.py
          python test_p0p1_l0i_px_integrated_sim.py
          python test_p0p1_l0i_px_integrated_sweep.py
          python test_p0p1_l0i_px_bottleneck_sweep.py
          python test_p0p1_l0i_px_refined_sweep.py
          python test_p0p1_l0i_px_middle_sweep.py
          python test_p0p1_l0i_px_workload_sweep.py
      - name: Run comparison smoke test
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --scale 1 --json > /tmp/nexus-cpu-results.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-cpu-results.json", encoding="utf-8"))
          expected = {"amd_9950x3d2", "intel_xeon_698x", "apple_m6", "nexus_balanced_128"}
          assert set(data) == expected, set(data)
          assert len({row["total_ops"] for row in data.values()}) == 1
          print("NATIVE PROFILE ARCHITECTURE COMPARISON")
          for key, result in data.items():
              print(f'{key}: cycles={result["total_cycles"]} ops={result["total_ops"]} IPC={result["aggregate_ipc"]}')
              for name, kernel in result["kernels"].items():
                  print(f'  {name}: cycles={kernel["cycles"]} ops={kernel["ops"]} IPC={kernel["aggregate_ipc"]}')
          PY
      - name: Run combined cross-architecture and CodeFlow suite
        run: |
          python "NEXUS CPU/tools/run_cross_arch_codeflow_suite.py" --scale 1 --pages 64 --tasks 4 --json > /tmp/nexus-cross-arch-codeflow.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/nexus-cross-arch-codeflow.json",encoding="utf-8"))
          assert data["same_logical_ops_all_architectures"]
          assert set(data["architecture_results"]) == {"amd_9950x3d2","intel_xeon_698x","apple_m6","nexus_balanced_128"}
          assert set(data["codeflow_beat_interval_sweep"]) == {"1","2","4","8"}
          assert len({x["pages_completed"] for x in data["codeflow_beat_interval_sweep"].values()}) == 1
          print("PASS: same composite operations across four CPU models; CodeFlow lane interval sweep completed all pages.")
          PY
      - name: Run four-way Task Workspace / Code Slots ablation
        run: python "NEXUS CPU/tools/cpu_comparison_sim.py" --ablation --scale 1
      - name: Run normalized eight-core comparison
        # All four profiles use the same configured core count and logical operation count.
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --normalized-8core --scale 1 --json > /tmp/nexus-normalized-8core.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-normalized-8core.json", encoding="utf-8"))
          assert len(data) == 4
          assert {row["cores_configured"] for row in data.values()} == {8}
          assert len({row["total_ops"] for row in data.values()}) == 1
          print("PASS: normalized 8-core run, same operation count across all four architectures.")
          PY
      - name: Run mixed-width INT and FP execution topology sweep
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --execution-sweep --scale 1 --json > /tmp/nexus-execution-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-execution-sweep.json", encoding="utf-8"))
          assert data["experiment"] == "NEXSUS mixed-width INT and six-lane FP execution topology"
          assert data["kernels"]["integer_throughput"]["ops_preserved"]
          assert data["kernels"]["integer128_throughput"]["ops"] == 256
          assert data["kernels"]["fp_throughput"]["ops_preserved"]
          print("MIXED-WIDTH EXECUTION TOPOLOGY")
          for name, row in data["kernels"].items():
              print(f'{name}: baseline={row["baseline_cycles"]} proposed={row["proposed_cycles"]} '
                    f'saved={row["cycles_saved"]} ({row["improvement_percent"]}%)')
          PY

      - name: Run INT and FP resource-count design-space sweep
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --resource-sweep --scale 1 --json > /tmp/nexus-resource-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-resource-sweep.json", encoding="utf-8"))
          assert len(data["results"]) == 20
          assert len({row["total_ops"] for row in data["results"].values()}) == 1
          for variant in data["results"].values():
              assert all(row["ops_preserved"] for row in variant["kernels"].values())
          print("INT/FP RESOURCE COUNT SWEEP")
          for key, row in data["results"].items():
              i64 = row["kernels"]["integer_throughput"]
              i128 = row["kernels"]["integer128_throughput"]
              fp = row["kernels"]["fp_throughput"]
              print(f'{key}: INT64={i64["cycles"]} INT128={i128["cycles"]} FP64={fp["cycles"]} '
                    f'unit_stalls={i64["execution_unit_blocked_op_cycles"]}/'
                    f'{i128["execution_unit_blocked_op_cycles"]}/'
                    f'{fp["execution_unit_blocked_op_cycles"]}')
          PY

      - name: Run FP64 and dedicated FMA lane topology sweep
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --fma-sweep --scale 1 --json > /tmp/nexus-fma-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-fma-sweep.json", encoding="utf-8"))
          assert set(data["results"]) == {"FP6_FMA2", "FP6_FMA4", "FP8_FMA2", "FP8_FMA4"}
          for variant in data["results"].values():
              assert all(row["ops_preserved"] for row in variant["kernels"].values())
          print("FP64 / FMA RESOURCE SWEEP")
          for key, row in data["results"].items():
              fp = row["kernels"]["fp_throughput"]
              fma = row["kernels"]["fma_throughput"]
              mixed = row["kernels"]["fp_fma_mixed"]
              chain = row["kernels"]["fma_dependency_chain"]
              print(f'{key}: FP64={fp["cycles"]} FMA={fma["cycles"]} '
                    f'FMA_CHAIN={chain["cycles"]} MIXED={mixed["cycles"]} '
                    f'unit_stalls={fp["execution_unit_blocked_op_cycles"]}/'
                    f'{fma["execution_unit_blocked_op_cycles"]}/'
                    f'{mixed["execution_unit_blocked_op_cycles"]}')
          PY
      - name: Run Data RAM per-core MSHR capacity sweep
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --mshr-sweep --json > /tmp/nexus-data-mshr-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-data-mshr-sweep.json", encoding="utf-8"))
          expected = {"1", "2", "4", "8", "16", "32", "64", "128"}
          assert set(data["results"]) == expected
          assert data["cores"] == 8
          assert data["same_cold_load_workload"]
          assert data["app_ram_and_data_ram_controllers_independent"]
          for capacity, row in data["results"].items():
              assert row["ops_retired"] == 8 * data["ops_per_core"], capacity
              assert row["data_ram_requests"] == row["ops_retired"], capacity
              assert all(value <= int(capacity) for value in row["max_outstanding_per_core"]), capacity
              assert row["total_full_cycles"] == sum(row["full_cycles_per_core"]), capacity
              assert row["total_full_cycles"] <= row["total_blocked_request_attempts"], capacity
          assert data["results"]["1"]["total_blocked_request_attempts"] > 0
          assert data["results"]["1"]["total_full_cycles"] > 0
          assert data["results"]["128"]["total_full_cycles"] == 0
          assert set(data["mixed_results"]) == expected
          for capacity, row in data["mixed_results"].items():
              assert row["ops_retired"] == 8 * data["mixed_workload"]["ops_per_core"], capacity
              assert row["data_ram_requests"] == 8 * data["mixed_workload"]["load_ops_per_core"], capacity
              assert all(value <= int(capacity) for value in row["max_outstanding_per_core"]), capacity
              assert row["total_full_cycles"] == sum(row["full_cycles_per_core"]), capacity
              assert row["total_full_cycles"] <= row["total_blocked_request_attempts"], capacity
          assert data["mixed_results"]["1"]["total_full_cycles"] > 0
          assert data["mixed_results"]["128"]["total_full_cycles"] == 0
          print("DATA RAM PER-CORE MSHR CAPACITY SWEEP")
          for capacity, row in data["results"].items():
              print(f'{capacity} entries/core: cycles={row["cycles"]} '
                    f'max_outstanding={max(row["max_outstanding_per_core"])} '
                    f'full_cycles={row["total_full_cycles"]} '
                    f'blocked_retries={row["total_blocked_request_attempts"]} '
                    f'requests={row["data_ram_requests"]}')
          print("MIXED COMPUTE/LOAD MSHR CAPACITY SWEEP")
          for capacity, row in data["mixed_results"].items():
              print(f'{capacity} entries/core: cycles={row["cycles"]} '
                    f'max_outstanding={max(row["max_outstanding_per_core"])} '
                    f'full_cycles={row["total_full_cycles"]} '
                    f'blocked_retries={row["total_blocked_request_attempts"]} '
                    f'loads={row["data_ram_requests"]} ops={row["ops_retired"]}')
          PY
      - name: Run branch predictor sensitivity sweep
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --branch-sweep --scale 1 --json > /tmp/nexus-branch-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-branch-sweep.json", encoding="utf-8"))
          for name, row in data["kernels"].items():
              assert row["ops_preserved"], name
              print(f'{name}: off={row["cycles_predictor_off"]} compact={row["cycles_compact_predictor"]} mispredicts={row["mispredicts_predictor_off"]}->{row["mispredicts_compact_predictor"]}')
          PY
      - name: Run CS code-slot capacity sensitivity sweep
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --cs-sweep --scale 1 --json > /tmp/nexus-cs-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-cs-sweep.json", encoding="utf-8"))
          rows = list(data["results"].values())
          assert len({row["total_ops"] for row in rows}) == 1
          assert len({row["total_cycles"] for row in rows}) > 1, "CS capacity must affect code-page miss cost"
          misses = {row["kernels"]["cs_starvation"]["code_slots"]["pool_misses"] for row in rows}
          assert len(misses) > 1, misses
          print("CS CODE-SLOT CAPACITY SENSITIVITY")
          for row in data["results"].values():
              starve = row["kernels"]["cs_starvation"]["cycles"]
              print(f'{row["capacity_kb"]} KiB: total_cycles={row["total_cycles"]} cs_starvation_cycles={starve} ops={row["total_ops"]}')
          PY
      - name: Run instruction fetch latency sensitivity sweep
        run: |
          python "NEXUS CPU/tools/cpu_comparison_sim.py" --fetch-sweep --json > /tmp/nexus-fetch-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-fetch-sweep.json", encoding="utf-8"))
          assert {"32", "34", "48"}.issubset(set(data["results"]["nexus_p0"]))
          assert len({row["ops"] for group in data["results"].values() for row in group.values()}) == 1
          print("INSTRUCTION FETCH REFILL SENSITIVITY")
          for profile, rows in data["results"].items():
              for row in rows.values():
                  print(f'{profile}: refill={row["refill_latency_cycles"]} cycles={row["cycles"]} ops={row["ops"]}')
          PY
      - name: Run P0/P1 command buffer tests and baseline
        run: |
          python "NEXUS CPU/tools/p0p1_command_buffer_sim.py" --blocks 16 --json > /tmp/nexus-p0p1.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-p0p1.json", encoding="utf-8"))
          assert data["blocks_consumed"] == 16
          assert data["refill_count"] == 16
          assert data["refill_bytes"] == 16 * 8192
          assert data["boundary_stalls"] == 168, data
          assert data["overlap_cycles"] > 0
          print("P0/P1 baseline:", data)
          PY
      - name: Run P0/P1 refill parameter sweep
        run: |
          python "NEXUS CPU/tools/p0p1_refill_sweep.py" > /tmp/nexus-p0p1-sweep.json
          python - <<'PY'
          import json
          data=json.load(open("/tmp/nexus-p0p1-sweep.json",encoding="utf-8"))
          assert data["cases"] > 100
          ref=[r for r in data["results"] if (r["buffer_kb"],r["app_bytes_per_cycle"],r["setup_cycles"],r["consume_bytes_per_cycle"])==(8,64,40,8)]
          assert len(ref)==1 and ref[0]["refill_latency_cycles"]==168
          assert not ref[0]["starvation_after_cold_fill"]
          assert any(r["starvation_after_cold_fill"] for r in data["results"])
          print(f"PASS: {data['cases']} P0/P1 configurations swept; starvation boundary identified.")
          PY
      - name: Run P0/P1 branch redirect baseline
        run: |
          python "NEXUS CPU/tools/p0p1_branch_redirect_sim.py" --json > /tmp/nexus-p0p1-redirect.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/nexus-p0p1-redirect.json",encoding="utf-8"))
          assert d["refill_latency"] == 168
          assert d["wrong_path_bytes_discarded"] == 8192
          assert d["redirect_stall_cycles"] == 168
          assert d["target_ready_cycle"] == 1360
          print("P0/P1 redirect:",d)
          PY
          python "NEXUS CPU/tools/p0p1_branch_redirect_sim.py" --integrated --json > /tmp/nexus-p0p1-integrated-redirect.json
          python - <<'PY'
          import json
          d=json.load(open("/tmp/nexus-p0p1-integrated-redirect.json",encoding="utf-8"))
          assert d["app_refill_cycles"] == 168
          assert d["p0p1_to_c0_cycles"] == 128
          assert d["c0_to_cs_cycles"] == 103
          assert d["cs_to_eb_cycles"] == 103
          assert d["eb_delivery_cycles"] == 128
          assert d["target_delivery_latency"] == 630
          assert d["p0p1_wrong_path_block_discarded_bytes"] == 8192
          assert d["queued_wrong_path_pages_flushed"] == 2
          assert d["queued_wrong_path_bytes_flushed"] == 4096
          assert d["target_ready_cycle"] == 1310
          print("INTEGRATED FRONTEND REDIRECT:", d)
          PY
      - name: Run integrated frontend parameter sweep
        run: |
          python "NEXUS CPU/tools/p0p1_l0i_px_integrated_sweep.py" --pages 32 --json > /tmp/nexus-integrated-frontend-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-integrated-frontend-sweep.json", encoding="utf-8"))
          assert data["cases"] >= 20
          assert data["pages"] == 32
          assert len(data["results"]) == data["cases"]
          baseline = next(row for row in data["results"] if row["case"] == "baseline")
          assert baseline["app_refill_latency"] == 168
          assert baseline["cold_stall_cycles"] == 168
          assert baseline["boundary_stall_cycles"] == 0
          for row in data["results"]:
              assert row["pages_retired"] == 32, row["case"]
              assert row["pages_requested"] == 32, row["case"]
              assert row["p0p1_refills"] == 8, row["case"]
              assert row["app_bytes_read"] == 8 * 8192, row["case"]
              assert row["queue_peaks"]["c0"] <= row["config"]["queue_depth"], row["case"]
              assert row["queue_peaks"]["cs"] <= row["config"]["queue_depth"], row["case"]
              assert row["queue_peaks"]["eb"] <= row["config"]["queue_depth"], row["case"]
          print(f'PASS: {data["cases"]} integrated frontend configurations completed the same 32-page workload.')
          print(f'Baseline: {data["baseline_cycles"]} cycles.')
          for row in sorted(data["results"], key=lambda item: item["cycles"])[:5]:
              print(f'{row["case"]}: {row["cycles"]} cycles ({row["cycle_change_percent"]:+.3f}%)')
          PY
      - name: Run focused P0/P1 and EB bottleneck interaction sweep
        run: |
          python "NEXUS CPU/tools/p0p1_l0i_px_bottleneck_sweep.py" --pages 32 --json > /tmp/nexus-frontend-bottleneck-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-frontend-bottleneck-sweep.json", encoding="utf-8"))
          assert data["cases"] == 29
          assert data["pages"] == 32
          assert len(data["results"]) == 29
          baseline = next(row for row in data["results"] if row["case"] == "p0p1=8,eb=8")
          assert baseline["cycles"] == data["baseline_cycles"]
          for row in data["results"]:
              assert row["pages_retired"] == 32, row["case"]
              depth = row["config"]["queue_depth"]
              assert all(value <= depth for value in row["queue_peaks"].values()), row["case"]
          print(f'PASS: {data["cases"]} bottleneck combinations completed the same 32-page workload.')
          print(f'Baseline: {data["baseline_cycles"]} cycles.')
          for row in sorted(data["results"], key=lambda item: item["cycles"])[:8]:
              print(f'{row["case"]}: {row["cycles"]} cycles ({row["cycle_change_percent"]:+.3f}%), '
                    f'CPU-not-ready={row["cpu_not_ready_stall_cycles"]}')
          PY
      - name: Run refined frontend operating-point sweep
        run: |
          python "NEXUS CPU/tools/p0p1_l0i_px_refined_sweep.py" --pages 32 --json > /tmp/nexus-frontend-refined-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-frontend-refined-sweep.json", encoding="utf-8"))
          assert data["cases"] == 33
          assert data["pages"] == 32
          assert data["baseline_cycles"] == 8876
          assert len(data["results"]) == 33
          for row in data["results"]:
              assert row["pages_retired"] == 32, row["case"]
              depth = row["config"]["queue_depth"]
              assert all(value <= depth for value in row["queue_peaks"].values()), row["case"]
          print("REFINED FRONTEND OPERATING POINT")
          print(f'Baseline: {data["baseline_cycles"]} cycles.')
          for row in sorted(data["results"], key=lambda item: item["cycles"])[:10]:
              print(f'{row["case"]}: {row["cycles"]} cycles ({row["cycle_change_percent"]:+.3f}%), '
                    f'App refill={row["app_refill_latency"]}')
          PY
      - name: Run middle frontend-stage rate sweep
        run: |
          python "NEXUS CPU/tools/p0p1_l0i_px_middle_sweep.py" --pages 32 --json > /tmp/nexus-frontend-middle-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-frontend-middle-sweep.json", encoding="utf-8"))
          assert data["cases"] == 25
          assert data["pages"] == 32
          assert data["baseline_cycles"] == 4652
          for row in data["results"]:
              assert row["pages_retired"] == 32, row["case"]
              assert all(v <= row["config"]["queue_depth"] for v in row["queue_peaks"].values()), row["case"]
          print("MIDDLE FRONTEND STAGE RATE SWEEP")
          print(f'16/16 baseline: {data["baseline_cycles"]} cycles.')
          for row in sorted(data["results"], key=lambda item: item["cycles"])[:8]:
              print(f'{row["case"]}: {row["cycles"]} cycles '
                    f'({row["cycle_change_percent_vs_16_16"]:+.3f}%)')
          PY
      - name: Run frontend workload-length sweep
        run: |
          python "NEXUS CPU/tools/p0p1_l0i_px_workload_sweep.py" --json > /tmp/nexus-frontend-workload-sweep.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/nexus-frontend-workload-sweep.json", encoding="utf-8"))
          assert data["cases"] == 21
          assert data["page_counts"] == [1, 2, 4, 8, 16, 32, 64]
          assert data["middle_rates_bytes_per_cycle"] == [16, 20, 32]
          for row in data["results"]:
              assert row["pages_retired"] == row["pages_requested"] == row["pages"]
              assert row["p0p1_refills"] == (row["pages"] + 3) // 4
              assert row["app_bytes_read"] == row["p0p1_refills"] * 8192
              assert row["boundary_stall_cycles"] == 0
              assert all(v <= 2 for v in row["queue_peaks"].values())
          refs = {row["middle_rate_bytes_per_cycle"]: row["cycles"]
                  for row in data["results"] if row["pages"] == 32}
          assert refs == {16: 4652, 20: 4602, 32: 4524}, refs
          print("FRONTEND WORKLOAD-LENGTH SWEEP")
          for row in data["results"]:
              print(f'{row["pages"]:>2} pages @ {row["middle_rate_bytes_per_cycle"]:>2} B/cycle: '
                    f'{row["cycles"]:>6} cycles ({row["cycle_change_percent_vs_16"]:+.3f}%)')
          PY
      - name: Upload comparison and CS sweep results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-cpu-comparison-results
          path: |
            /tmp/nexus-cpu-results.json
            /tmp/nexus-data-mshr-sweep.json
            /tmp/nexus-cs-sweep.json
